wp-docs small{display:block}#wp-app .wp-blocklabel{display:block;margin-top:18px;margin-bottom:6px}#wp-app textarea{width:100%;min-height:90px;resize:vertical}#wp-app .wp-back{color:var(--wp-dim);padding-left:0;margin-bottom:14px}
#wp-app .wp-legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px;margin-bottom:14px;color:var(--wp-dim)}#wp-app .wp-legend span{display:flex;align-items:center;gap:6px}#wp-app .wp-swatch{width:23px;height:7px;display:inline-block;background:var(--wp-base)}#wp-app .wp-swatch.current{background:var(--wp-blue);height:4px}#wp-app .wp-swatch.actual{background:var(--wp-green);height:11px;border-radius:3px}#wp-app .wp-gantt{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0}#wp-app .wp-axis{display:flex;justify-content:space-between;font-size:11px;color:var(--wp-dim);padding:4px 0 7px;gap:4px}#wp-app .wp-gname{border-top:1px solid var(--wp-line);padding:13px 10px 13px 0;overflow-wrap:anywhere}#wp-app .wp-gname button{padding:0;font-size:13px}#wp-app .wp-gname button[aria-pressed=true]{text-decoration:underline;text-underline-offset:4px}#wp-app .wp-track{border-top:1px solid var(--wp-line);padding:10px 0;display:flex;flex-direction:column;gap:5px;background-image:linear-gradient(to right,var(--wp-line) 1px,transparent 1px);background-size:25% 100%}#wp-app .wp-lane{position:relative;height:12px;min-width:0}#wp-app .wp-bar{position:absolute;top:2px;height:7px;background:var(--wp-base);min-width:2px;border:0;border-radius:1px}#wp-app .wp-bar.current{height:4px;top:4px;background:var(--wp-blue)}#wp-app .wp-bar.actual{height:11px;top:0;background:var(--wp-green);border-radius:3px}#wp-app .wp-missing{position:absolute;left:5px;font-size:11px;color:var(--wp-dim);line-height:12px}#wp-app .wp-report-canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--wp-line);margin:14px 0}#wp-app .wp-report-rows{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px}#wp-app .wp-error{color:light-dark(#a72c28,#f4a29b)}#wp-app .wp-datehint{font-size:12px;color:var(--wp-dim)}

<script>
(()=>{
const root=document.getElementById('wp-app'),content=root.querySelector('#wp-content'),status=root.querySelector('#wp-status');
const states=['未着手','進行中','待ち','完了','中止','いつか'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today='2026-11-03',day=86400000,toDay=s=>Date.parse(s+'T00:00:00Z')/day,date=n=>new Date(n*day).toISOString().slice(0,10),short=s=>s?s.slice(5).replace('-','/'):'未設定';
let items=[{id:'experiment',title:'温度特性の実験',state:'進行中',summary:'室温の測定済み。低温側の条件を調整中。',origin:'',due:'2026-11-13',review:'2026-11-05',body:'恒温槽が安定してから測定を開始する。'},{id:'noise',title:'ノイズ条件を変えて推定誤差を比較',state:'未着手',summary:'手順書確認済み。試料を準備する。',origin:'experiment',due:'2026-11-09',review:'',body:''},{id:'cold',title:'低温でも推定精度が維持されるか確認',state:'いつか',summary:'次回の低温試験で確認する。',origin:'experiment',due:'',review:'2026-11-10',body:''},{id:'drift',title:'連続運転時のドリフトを確認',state:'いつか',summary:'装置を半日占有できるタイミングで確認。',origin:'experiment',due:'',review:'',body:''},{id:'fixture',title:'治具の仕様について回答を確認',state:'待ち',summary:'製作担当へ問い合わせ済み。',origin:'',due:'',review:'2026-11-03',body:''}];
let plans=[{id:'prep',title:'検証環境の準備',start:'2026-10-26',end:'2026-10-30',baseStart:'2026-10-26',baseEnd:'2026-10-30',actualStart:'2026-10-27',actualEnd:'2026-11-02',related:'noise'},{id:'thermal',title:'温度特性の検証',start:'2026-11-02',end:'2026-11-13',baseStart:'2026-11-02',baseEnd:'2026-11-10',actualStart:'2026-11-03',actualEnd:'',related:'experiment'},{id:'report',title:'評価結果の整理・報告',start:'2026-11-16',end:'2026-11-20',baseStart:'2026-11-11',baseEnd:'2026-11-17',actualStart:'',actualEnd:'',related:''}];
let docs=[{id:'manual',title:'恒温槽 装置マニュアル',path:'D:\\Research\\装置資料\\恒温槽マニュアル.pdf',description:'操作方法・校正・トラブル対応',theme:'制御アルゴリズム開発',links:[{itemId:'experiment',memo:'校正手順は p.12'},{itemId:'cold',memo:'低温設定の制限を確認'}]},{id:'procedure',title:'温度試験の手順書',path:'D:\\Research\\試験手順\\温度試験.docx',description:'準備から測定までの標準手順',theme:'制御アルゴリズム開発',links:[{itemId:'experiment',memo:'測定前に確認'}]},{id:'log',title:'11月 実験メモ',path:'D:\\Research\\実験ログ\\2026-11.docx',description:'条件・観察・測定結果の記録',theme:'制御アルゴリズム開発',links:[{itemId:'experiment',memo:'11/03 の条件調整'},{itemId:'noise',memo:'ノイズ条件の記録'}]},{id:'sheet',title:'温度特性の計算シート',path:'D:\\Research\\評価\\温度特性.xlsx',description:'推定誤差と温度補正の計算',theme:'制御アルゴリズム開発',links:[{itemId:'experiment',memo:'結果・計算'}]},{id:'ref',title:'アルゴリズムA 参考リンク',path:'https://example.com/algorithm-a',description:'参考URL（サンプル）',theme:'制御アルゴリズム開発',links:[{itemId:'noise',memo:'比較方法の参考'}]},{id:'unlinked',title:'測定器の校正記録',path:'D:\\Research\\共通資料\\校正記録.pdf',description:'関連付け前の資料',theme:'',links:[]}];
let page='documents',selected='experiment',planId='thermal',search='',stateFilter='active',sort='title',compare=true,baselineAsk=false,report=false,add=false,itemNew=false,reportMode='compare',from='2026-10-26',until='2026-11-27',chosen=['prep','thermal','report'],scale='2',docSearch='',docType='',docTheme='',docSort='title',docEditor=null;
function restore(s){const p=s?.privateContent;if(!p||![2,3].includes(p.version))return;if(Array.isArray(p.items)&&p.items.length>0&&p.items.length<30)items=p.items.map(x=>({...x,state:({'あとで':'いつか','次にやる':'未着手','保留':'中止'})[x.state]||x.state}));if(Array.isArray(p.plans)&&p.plans.length===3)plans=p.plans;if(p.version===3&&Array.isArray(p.docs)&&p.docs.length<30)docs=p.docs;if(['home','plan','theme','detail','documents'].includes(p.page))page=p.page;if(items.some(x=>x.id===p.selected))selected=p.selected;if(plans.some(x=>x.id===p.planId))planId=p.planId;if(typeof p.compare==='boolean')compare=p.compare;if(typeof p.search==='string')search=p.search;if(['active','all','未着手','進行中','待ち'].includes(p.stateFilter))stateFilter=p.stateFilter;if(['title','state','due','review'].includes(p.sort))sort=p.sort;}
restore(window.openai?.widgetState);
function save(){const snapshot={modelContent:{screen:page,comparison:compare,somedayCount:items.filter(x=>x.state==='いつか').length,documentCount:docs.length},privateContent:{version:3,page,selected,planId,items,plans,docs,compare,search,stateFilter,sort}};if(new TextEncoder().encode(JSON.stringify(snapshot)).length>15000){say('試作の保持容量を超えました。入力内容はこの画面を開いている間だけ保持されます。',true);return;}window.openai?.setWidgetState?.(snapshot)?.catch(()=>{});}
function say(t,error=false){status.textContent=t;status.classList.toggle('wp-error',error);}
function stateSelect(x){return `<select data-state="${esc(x.id)}" aria-label="${esc(x.title)}の状態">${states.map(s=>`<option ${s===x.state?'selected':''}>${s}</option>`).join('')}</select>`;}
function laterRow(x){return `<div class="wp-listrow">${stateSelect(x)}<button data-open="${esc(x.id)}">${esc(x.title)}<small>${esc(x.summary||'サマリ未入力')}</small>${x.review?`<small>確認日 ${short(x.review)}${x.review<=today?' · 確認日を迎えています':''}</small>`:''}</button></div>`;}
function filtered(){return items.filter(x=>['未着手','進行中','待ち'].includes(x.state)&&(['all','active'].includes(stateFilter)||x.state===stateFilter)&&(x.title+x.summary+x.body).toLowerCase().includes(search.toLowerCase())).sort((a,b)=>sort==='state'?states.indexOf(a.state)-states.indexOf(b.state):sort==='due'||sort==='review'?(a[sort]||'9999').localeCompare(b[sort]||'9999'):a.title.localeCompare(b.title,'ja'));}
function tableRows(){return filtered().map(x=>`<tr><td><button data-open="${x.id}">${esc(x.title)}</button><small>${esc(x.theme??'制御アルゴリズム開発')||'テーマ未所属'}</small></td><td>${stateSelect(x)}</td><td><input data-summary="${x.id}" aria-label="${esc(x.title)}のサマリ" value="${esc(x.summary)}" placeholder="サマリを入力"></td></tr>`).join('')||'<tr><td colspan="3">該当する検討項目はありません。</td></tr>';}
function newItemForm(){return itemNew?`<form class="wp-box" id="wp-new-item"><label>検討項目名<input name="title" required maxlength="120" placeholder="タイトルだけで作成できます"></label><small>初期状態：未着手${page==='theme'?' · テーマ：制御アルゴリズム開発':' · テーマ未所属'}</small><div class="wp-tools"><button class="wp-primary" type="submit">作成</button><button type="button" data-action="cancel-new-item">キャンセル</button></div></form>`:'';}
function home(){const later=items.filter(x=>x.state==='いつか');return `<h1>ホーム</h1><div class="wp-subhead"><h2>検討項目 <small id="wp-count">${filtered().length}件</small></h2><button class="wp-outline" data-action="new-item">＋ 新規作成</button></div>${newItemForm()}<div class="wp-tools"><label>検索<input id="wp-search" value="${esc(search)}" placeholder="タイトル・本文・サマリ"></label><label>状態<select id="wp-filter">${[['active','取り組む項目すべて'],...['未着手','進行中','待ち'].map(s=>[s,s])].map(([v,t])=>`<option value="${v}" ${v===stateFilter||v==='active'&&stateFilter==='all'?'selected':''}>${t}</option>`).join('')}</select></label><label>並べ替え<select id="wp-sort">${[['title','タイトル順'],['state','状態順'],['due','期限が近い順'],['review','確認日が近い順']].map(([v,t])=>`<option value="${v}" ${v===sort?'selected':''}>${t}</option>`).join('')}</select></label></div><table class="wp-table" aria-label="今取り組む検討項目"><thead><tr><th>検討項目 / テーマ</th><th>状態</th><th>サマリ</th></tr></thead><tbody id="wp-rows">${tableRows()}</tbody></table><section class="wp-later"><h2>いつか <small>${later.length}件</small></h2><small>上の一覧の検索・フィルターにかかわらず表示</small>${later.map(laterRow).join('')||'<p class="wp-dim">いつか確認する項目はありません。</p>'}</section>`;}
function detail(){const x=items.find(x=>x.id===selected);return `<button class="wp-back" data-page="home">← ホームの一覧</button><h1>${esc(x.title)}</h1><div class="wp-tools">${stateSelect(x)}<small>${esc(x.theme??'制御アルゴリズム開発')||'テーマ未所属'}</small></div><label class="wp-blocklabel" for="wp-summary">サマリ</label><textarea id="wp-summary" rows="2">${esc(x.summary)}</textarea><div class="wp-dategrid"><label>期限<input type="date" data-item-date="due" value="${x.due}"></label><label>確認日<input type="date" data-item-date="review" value="${x.review}"></label></div><section class="wp-section"><div class="wp-subhead"><h2>関連資料</h2><button class="wp-outline" data-page="documents">資料目録へ</button></div>${itemDocs(x)}</section><label class="wp-blocklabel" for="wp-body">作業メモ</label><textarea id="wp-body" placeholder="確認方法・結果など">${esc(x.body)}</textarea>${x.origin?`<section class="wp-section"><h2>関連する作業</h2><button class="wp-outline" data-open="${x.origin}">${esc(items.find(v=>v.id===x.origin)?.title||'関連項目')} ↗</button></section>`:''}<div class="wp-subhead"><h2>関連する検討項目</h2><button class="wp-outline" data-action="add">＋ 気づきを残す</button></div>${add?`<form id="wp-add" class="wp-box"><label>タイトル<input name="title" required maxlength="120" placeholder="いつか確かめたいこと"></label><label>サマリ（任意）<input name="summary" maxlength="220" placeholder="実施条件・現状・メモなど"></label><small>独立ページとして作成 · 状態：いつか · 元ページへの関連を保持</small><div class="wp-tools"><button class="wp-primary" type="submit">作成</button><button type="button" data-action="cancel-add">キャンセル</button></div></form>`:''}${items.filter(v=>v.origin===x.id).map(laterRow).join('')}`;}
function typeOf(path){const s=path.toLowerCase().split(/[?#]/)[0];if(/^https?:\/\//i.test(path))return 'URL';if(s.endsWith('.pdf'))return 'PDF';if(/\.docx?$/.test(s))return 'Word';if(/\.xlsx?$/.test(s))return 'Excel';if(/\.pptx?$/.test(s))return 'PowerPoint';return 'その他';}
function itemDocs(x){const related=docs.filter(d=>d.links.some(l=>l.itemId===x.id));return `<div class="wp-docs">${related.map(d=>`<div><button data-doc="${d.id}">${esc(d.title)}<small>${esc(typeOf(d.path))} · ${esc(d.links.find(l=>l.itemId===x.id).memo||'用途メモなし')}</small></button><button data-doc-edit="${d.id}" aria-label="${esc(d.title)}の登録情報を編集">編集</button></div>`).join('')||'<p class="wp-dim">関連資料はありません。</p>'}</div>`;}
function filteredDocs(){return docs.filter(d=>(!docType||typeOf(d.path)===docType)&&(!docTheme||(docTheme==='none'?!d.theme:d.theme===docTheme))&&(d.title+' '+d.path+' '+d.description+' '+d.links.map(l=>l.memo).join(' ')).toLowerCase().includes(docSearch.toLowerCase())).sort((a,b)=>a.title.localeCompare(b.title,'ja')*(docSort==='desc'?-1:1));}
function catalogRows(){return filteredDocs().map(d=>`<tr><td><button data-doc="${d.id}">${esc(d.title)}</button><div class="wp-doc-path">${esc(d.path)}</div><p class="wp-doc-summary">${esc(d.description)}</p></td><td><span class="wp-type">${typeOf(d.path)}</span></td><td><small>${esc(d.theme)||'テーマ未関連'}</small>${d.links.map(l=>`<button class="wp-related" data-open="${l.itemId}">${esc(items.find(x=>x.id===l.itemId)?.title||'検討項目')} ↗</button>`).join('')||'<small>検討項目との関連なし</small>'}</td><td><button class="wp-edit-doc" data-doc-edit="${d.id}" aria-label="${esc(d.title)}の登録情報を編集">編集</button></td></tr>`).join('')||'<tr><td colspan="4">該当する資料はありません。</td></tr>';}
function docEditorView(){if(docEditor===null)return '';const d=docs.find(d=>d.id===docEditor)||{title:'',path:'',description:'',theme:'',links:[]};return `<section class="wp-catalog-editor"><div class="wp-subhead"><h2>${docEditor==='new'?'資料を登録':'登録情報を編集'}</h2><button data-action="close-doc">閉じる</button></div><form id="wp-doc-form" class="wp-box"><div class="wp-doc-fields"><label>参照先（ファイルパス・URL）<input name="path" required maxlength="500" value="${esc(d.path)}" placeholder="ファイルパスか https://... を貼り付け"></label><label>表示名（空欄なら参照先から自動設定）<input name="title" maxlength="160" value="${esc(d.title)}"></label><label>説明（任意）<input name="description" maxlength="220" value="${esc(d.description)}"></label><label>関連テーマ<select name="theme"><option value="" ${!d.theme?'selected':''}>未関連</option><option ${d.theme?'selected':''}>制御アルゴリズム開発</option></select></label></div><h2 class="wp-section">関連する検討項目・用途メモ</h2><div class="wp-link-editor">${items.map(x=>{const l=d.links.find(l=>l.itemId===x.id);return `<div class="wp-link-entry"><label class="wp-rel-check"><input type="checkbox" name="related" value="${x.id}" ${l?'checked':''}>${esc(x.title)}</label><input name="memo-${x.id}" value="${esc(l?.memo||'')}" maxlength="180" aria-label="${esc(x.title)}での用途メモ" placeholder="この検討項目での用途・参照箇所（任意）"></div>`;}).join('')}</div><small>参照先の変更は、この資料を参照する全ページへ反映。用途メモは関連先ごとに保持。</small><div class="wp-tools"><button class="wp-primary" type="submit">${docEditor==='new'?'登録':'保存'}</button><button type="button" data-action="close-doc">キャンセル</button></div></form></section>`;}
function catalog(){return `<h1>資料目録</h1><p class="wp-dim">登録した資料を、作業やテーマをまたいで一覧。</p><div class="wp-subhead"><h2>登録資料 <small id="wp-doc-count">${filteredDocs().length}件 / 全${docs.length}件</small></h2><button class="wp-primary" data-action="new-doc">＋ 資料を登録</button></div><div class="wp-tools"><label>検索<input id="wp-doc-search" value="${esc(docSearch)}" placeholder="資料名・参照先・メモ"></label><label>種類<select id="wp-doc-type">${[['','すべて'],...['PDF','Word','Excel','PowerPoint','URL','その他'].map(t=>[t,t])].map(([v,t])=>`<option value="${v}" ${v===docType?'selected':''}>${t}</option>`).join('')}</select></label><label>テーマ<select id="wp-doc-theme">${[['','すべて'],['制御アルゴリズム開発','制御アルゴリズム開発'],['none','未関連']].map(([v,t])=>`<option value="${v}" ${v===docTheme?'selected':''}>${t}</option>`).join('')}</select></label><label>並べ替え<select id="wp-doc-sort"><option value="asc" ${docSort==='title'?'selected':''}>名前 昇順</option><option value="desc" ${docSort==='desc'?'selected':''}>名前 降順</option></select></label></div><table class="wp-catalog" aria-label="登録資料の一覧"><thead><tr><th>資料名 / 参照先</th><th>種類</th><th>テーマ / 関連する検討項目</th><th>操作</th></tr></thead><tbody id="wp-doc-rows">${catalogRows()}</tbody></table>${docEditorView()}`;}
function period(a,b){return a?(short(a)+' → '+(b?short(b):'進行中')):'未入力';}
function limits(){const dates=plans.flatMap(p=>[p.start,p.end,...(compare?[p.baseStart,p.baseEnd,p.actualStart,p.actualEnd||p.actualStart&&today]:[])]).filter(Boolean).map(toDay);return {a:Math.min(toDay('2026-10-26'),...dates)-1,b:Math.max(toDay('2026-11-23'),...dates)+2};}
function bars(p,kind,a,b){let s=kind==='base'?p.baseStart:kind==='actual'?p.actualStart:p.start,e=kind==='base'?p.baseEnd:kind==='actual'?(p.actualEnd||(p.actualStart?today:'')):p.end;const label=kind==='base'?'当初予定':kind==='actual'?'実績':'最新予定';if(!s||!e)return `<div class="wp-lane"><span class="wp-missing">${label} 未入力</span></div>`;let left=(toDay(s)-a)/(b-a+1)*100,width=(toDay(e)-toDay(s)+1)/(b-a+1)*100;return `<div class="wp-lane"><div class="wp-bar ${kind==='current'?'current':kind==='actual'?'actual':''}" style="left:${left}%;width:${width}%" role="img" aria-label="${label} ${s}から${e}" data-tooltip="${label}：${period(s,kind==='actual'?p.actualEnd:e)}"></div></div>`;}
function gantt(){const {a,b}=limits(),ticks=Array.from({length:5},(_,i)=>date(Math.round(a+(b-a)*i/4)));return `<div class="wp-gantt"><small>計画行</small><div class="wp-axis">${ticks.map(d=>`<span>${short(d)}</span>`).join('')}</div>${plans.map(p=>`<div class="wp-gname"><button data-plan="${p.id}" aria-pressed="${planId===p.id}">${esc(p.title)}</button></div><div class="wp-track">${compare?bars(p,'base',a,b):''}${bars(p,'current',a,b)}${compare?bars(p,'actual',a,b):''}</div>`).join('')}</div>`;}
function dateField(p,key,label){return `<label>${label}<input type="date" data-plan-date="${key}" value="${p[key]}"></label>`;}
function planView(){const p=plans.find(p=>p.id===planId);return `<h1>計画</h1><p class="wp-dim">制御アルゴリズム開発</p><div class="wp-tools"><label><input id="wp-compare" type="checkbox" ${compare?'checked':''}>当初予定・実績を比較</label><button class="wp-outline" data-action="baseline">当初計画を保存</button><button class="wp-primary" data-action="report">画像コピーへ</button></div>${baselineAsk?`<div class="wp-box"><p>最新予定を、全3行の当初予定として保存します。</p><small>サンプルには当初予定が入っています。既存の当初予定は置き換わります。</small><div class="wp-tools"><button class="wp-primary" data-action="save-baseline">保存する</button><button data-action="cancel-baseline">キャンセル</button></div></div>`:''}<div class="wp-legend">${compare?'<span><i class="wp-swatch"></i>当初予定</span>':''}<span><i class="wp-swatch current"></i>最新予定</span>${compare?'<span><i class="wp-swatch actual"></i>実績</span>':''}</div>${gantt()}<div class="wp-box"><h2>${esc(p.title)}</h2><small>行名を選ぶと、その計画の日程を編集できます。</small><div class="wp-dategrid">${dateField(p,'start','最新予定：開始')}${dateField(p,'end','最新予定：終了')}</div>${compare?`<p class="wp-datehint">当初予定：${period(p.baseStart,p.baseEnd)}</p><div class="wp-dategrid">${dateField(p,'actualStart','実績：開始')}${dateField(p,'actualEnd','実績：終了')}</div><div class="wp-tools"><button class="wp-outline" data-action="start">開始（今日）</button><button class="wp-outline" data-action="finish">完了（今日）</button></div><small>実績の終了日がない行は、今日（11/03）まで進行中として表示。</small>`:''}${p.related?`<div class="wp-tools"><small>関連する検討項目</small><button data-open="${p.related}">${esc(items.find(x=>x.id===p.related)?.title||'検討項目')} ↗</button></div>`:''}</div>${report?reportView():''}`;}
function reportView(){return `<section class="wp-section"><div class="wp-subhead"><h2>報告用画像のプレビュー</h2><button data-action="close-report">閉じる</button></div><div class="wp-tools"><label>期間<input type="date" id="wp-from" value="${from}"></label><label>〜<input type="date" id="wp-until" value="${until}"></label><label>内容<select id="wp-report-mode"><option value="compare" ${reportMode==='compare'?'selected':''}>当初予定と実績</option><option value="current" ${reportMode==='current'?'selected':''}>最新予定のみ</option></select></label><label>解像度<select id="wp-scale"><option value="1" ${scale==='1'?'selected':''}>標準</option><option value="2" ${scale==='2'?'selected':''}>高解像度（2倍）</option></select></label></div><div class="wp-report-rows">${plans.map(p=>`<label><input type="checkbox" data-export-row="${p.id}" ${chosen.includes(p.id)?'checked':''}>${esc(p.title)}</label>`).join('')}</div><canvas class="wp-report-canvas" id="wp-canvas" role="img" aria-label="PowerPoint貼り付け用のガント画像"></canvas><div class="wp-tools"><button class="wp-primary" data-action="copy">画像をコピー</button><small id="wp-copy-info">白背景・操作ボタンなし</small></div></section>`;}
function render(){root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));root.querySelector('#wp-crumb').textContent=({home:'ホーム',theme:'制御アルゴリズム開発',detail:'検討項目',plan:'計画 / 制御アルゴリズム開発',documents:'資料目録'})[page];if(page==='home')content.innerHTML=home();if(page==='documents')content.innerHTML=catalog();if(page==='detail')content.innerHTML=detail();if(page==='plan')content.innerHTML=planView();if(page==='theme')content.innerHTML=`<h1>制御アルゴリズム開発</h1><p class="wp-dim">推定精度と環境変化への安定性を検証する。</p><div class="wp-tools"><button class="wp-outline" data-action="new-item">＋ 検討項目を作成</button><button data-page="documents">資料目録へ</button></div>${newItemForm()}<section class="wp-section"><h2>検討項目 <small>完了・中止も含む</small></h2>${items.filter(x=>(x.theme??'制御アルゴリズム開発')==='制御アルゴリズム開発').map(laterRow).join('')}</section>`;if(page==='plan'&&report)drawReport();if(globalThis.lucide)lucide.createIcons();}
function wrap(ctx,text,max){const out=[];let s='';for(const c of text){if(ctx.measureText(s+c).width>max&&s){out.push(s);s=c;}else s+=c;}if(s)out.push(s);return out;}
function drawReport(){const canvas=root.querySelector('#wp-canvas');if(!canvas)return;const a=toDay(from),b=toDay(until),list=plans.filter(p=>chosen.includes(p.id)),valid=Number.isFinite(a)&&Number.isFinite(b)&&b>=a&&b-a<=366&&list.length>0;const info=root.querySelector('#wp-copy-info');canvas.hidden=!valid;const copy=root.querySelector('[data-action=copy]');copy.disabled=!valid;if(!valid){info.textContent='1行以上を選び、1〜367日以内の有効な期間を指定してください。';return;}const W=1120,labelWidth=290,rowH=100,H=135+rowH*list.length,k=Number(scale);canvas.width=W*k;canvas.height=H*k;const ctx=canvas.getContext('2d');ctx.scale(k,k);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.fillStyle='#30382e';ctx.font='500 24px "Yu Gothic UI",sans-serif';ctx.fillText('制御アルゴリズム開発',28,38);ctx.font='16px "Yu Gothic UI",sans-serif';ctx.fillStyle='#687362';ctx.fillText(from+' 〜 '+until,28,65);ctx.fillText(reportMode==='compare'?'当初予定（灰） / 実績（緑）':'最新予定（青）',620,65);const x0=labelWidth,x1=W-28,x=d=>x0+(toDay(d)-a)/(b-a+1)*(x1-x0);for(let i=0;i<=4;i++){const n=Math.round(a+(b-a)*i/4),px=x(date(n));ctx.strokeStyle='#e4e8df';ctx.beginPath();ctx.moveTo(px,100);ctx.lineTo(px,H-12);ctx.stroke();ctx.fillStyle='#687362';ctx.font='14px "Yu Gothic UI",sans-serif';ctx.textAlign=i===4?'right':'left';ctx.fillText(short(date(n)),px,94);}ctx.textAlign='left';list.forEach((p,i)=>{const y=116+i*rowH;ctx.fillStyle='#30382e';ctx.font='17px "Yu Gothic UI",sans-serif';wrap(ctx,p.title,labelWidth-48).forEach((t,j)=>ctx.fillText(t,28,y+20+j*23));const bar=(s,e,yy,color,h)=>{if(!s||!e)return;const start=Math.max(a,toDay(s)),end=Math.min(b,toDay(e));if(end<start)return;ctx.fillStyle=color;ctx.fillRect(x(date(start)),yy,Math.max(2,(end-start+1)/(b-a+1)*(x1-x0)),h);};if(reportMode==='compare'){bar(p.baseStart,p.baseEnd,y+5,'#a1aa99',9);bar(p.actualStart,p.actualEnd||(p.actualStart?today:''),y+30,'#456d49',15);ctx.font='13px "Yu Gothic UI",sans-serif';ctx.fillStyle='#687362';if(!p.actualStart)ctx.fillText('実績未入力',x0+6,y+48);else if(!p.actualEnd)ctx.fillText('実績：'+short(p.actualStart)+'〜進行中',x0+6,y+72);}else bar(p.start,p.end,y+18,'#4a709b',13);ctx.strokeStyle='#e4e8df';ctx.beginPath();ctx.moveTo(28,y+rowH-8);ctx.lineTo(x1,y+rowH-8);ctx.stroke();});info.textContent=canvas.width+' × '+canvas.height+' px · 白背景';}
function validPlan(p){return (!p.start||!p.end||p.start<=p.end)&&(!p.actualEnd||!!p.actualStart&&p.actualStart<=p.actualEnd)&&(!p.actualStart||p.actualStart<=today)&&(!p.actualEnd||p.actualEnd<=today);}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){page=b.dataset.page;add=false;say('');render();save();return;}if(b.dataset.open){selected=b.dataset.open;page='detail';add=false;say('');render();save();return;}if(b.dataset.plan){planId=b.dataset.plan;say('');render();save();return;}if(b.dataset.doc){say('「'+b.dataset.doc+'」を開く操作です。サンプルのため原本には接続しません。');return;}const p=plans.find(p=>p.id===planId);switch(b.dataset.action){case 'add':add=true;render();root.querySelector('[name=title]')?.focus();break;case 'cancel-add':add=false;render();break;case 'baseline':baselineAsk=true;render();break;case 'cancel-baseline':baselineAsk=false;render();break;case 'save-baseline':plans.forEach(p=>{p.baseStart=p.start;p.baseEnd=p.end;});baselineAsk=false;render();say('当初計画を保存しました。最新予定を変更しても、この日程は保持されます。');save();break;case 'report':report=true;render();say('コピーする期間・行・内容を選んでください。');break;case 'close-report':report=false;render();break;case 'start':case 'finish':{const next={...p};if(b.dataset.action==='start')next.actualStart=today;else{if(!p.actualStart){say('先に実績の開始日を入力してください。',true);break;}next.actualEnd=today;}if(!validPlan(next)){say('終了日が開始日より前になります。日付を確認してください。',true);break;}Object.assign(p,next);render();say('実績日を入力しました。関連項目の状態は変更していません。');save();break;}case 'copy':{const canvas=root.querySelector('#wp-canvas');if(!navigator.clipboard?.write||!globalThis.ClipboardItem){say('この表示環境では画像コピーを利用できません。プレビューは表示できます。Electron版ではアプリのコピー機能を使う予定です。',true);break;}try{const blob=new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(Error('画像生成に失敗')),'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);say('画像をコピーしました。PowerPointへ貼り付けられます。');}catch(err){say('この表示環境では画像コピーが許可されませんでした。Electron版ではアプリのコピー機能を使う予定です。',true);}break;}}});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.state){const x=items.find(x=>x.id===t.dataset.state);if(x)x.state=t.value;render();say('状態を変更しました。ホームの表示条件を再評価しました。');save();}if(t.id==='wp-filter'){stateFilter=t.value;render();save();}if(t.id==='wp-sort'){sort=t.value;render();save();}if(t.id==='wp-compare'){compare=t.checked;render();save();}if(t.dataset.itemDate){items.find(x=>x.id===selected)[t.dataset.itemDate]=t.value;save();say('日付を保存しました。');}if(t.dataset.planDate){const p=plans.find(p=>p.id===planId),key=t.dataset.planDate,next={...p,[key]:t.value};if(!validPlan(next)){say('開始・終了の順序と実績日を確認してください。実績に未来の日付は使えません。',true);render();return;}Object.assign(p,next);render();say('日程を変更しました。当初予定は保持されています。');save();}if(t.id==='wp-from')from=t.value;if(t.id==='wp-until')until=t.value;if(t.id==='wp-scale')scale=t.value;if(t.id==='wp-report-mode')reportMode=t.value;if(t.dataset.exportRow){chosen=t.checked?[...new Set([...chosen,t.dataset.exportRow])]:chosen.filter(v=>v!==t.dataset.exportRow);}if(['wp-from','wp-until','wp-scale','wp-report-mode'].includes(t.id)||t.dataset.exportRow)drawReport();});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='wp-search'){search=t.value;root.querySelector('#wp-rows').innerHTML=tableRows();root.querySelector('#wp-count').textContent=filtered().length+'件';save();}if(t.dataset.summary){items.find(x=>x.id===t.dataset.summary).summary=t.value;save();}if(t.id==='wp-summary'){items.find(x=>x.id===selected).summary=t.value;save();}if(t.id==='wp-body'){items.find(x=>x.id===selected).body=t.value;save();}});
root.addEventListener('submit',e=>{if(e.target.id!=='wp-add')return;e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim();if(!title)return;if(items.length>=25){say('試作で追加できる件数に達しました。',true);return;}items.push({id:'note-'+Date.now(),title,state:'いつか',theme:items.find(x=>x.id===selected).theme??'制御アルゴリズム開発',summary:String(f.get('summary')||'').trim(),origin:selected,due:'',review:'',body:''});add=false;render();say('独立した検討項目を「いつか」に作成しました。ホームの下部で確認できます。');save();});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.doc){const d=docs.find(d=>d.id===b.dataset.doc);say('「'+(d?.title||'資料')+'」の原本を開く操作です。試作ではサンプル参照先へのアクセスは行いません。');}if(b.dataset.docEdit){docEditor=b.dataset.docEdit;page='documents';render();say('表示名・参照先・説明と、関連先ごとの用途メモを編集できます。');save();}if(b.dataset.action==='new-doc'){docEditor='new';render();say('パスかURLを入力して登録できます。');}if(b.dataset.action==='close-doc'){docEditor=null;render();say('');}if(b.dataset.action==='new-item'){itemNew=true;render();root.querySelector('#wp-new-item [name=title]')?.focus();}if(b.dataset.action==='cancel-new-item'){itemNew=false;render();}});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='wp-doc-type'){docType=t.value;render();}if(t.id==='wp-doc-theme'){docTheme=t.value;render();}if(t.id==='wp-doc-sort'){docSort=t.value;render();}});
root.addEventListener('input',e=>{const t=e.target;if(t.id==='wp-doc-search'){docSearch=t.value;root.querySelector('#wp-doc-rows').innerHTML=catalogRows();root.querySelector('#wp-doc-count').textContent=filteredDocs().length+'件 / 全'+docs.length+'件';}});
root.addEventListener('submit',e=>{if(e.target.id==='wp-new-item'){e.preventDefault();const f=new FormData(e.target),title=String(f.get('title')||'').trim();if(!title)return;if(items.length>=25){say('試作で追加できる件数に達しました。',true);return;}items.push({id:'item-'+Date.now(),title,state:'未着手',theme:page==='theme'?'制御アルゴリズム開発':'',summary:'',origin:'',due:'',review:'',body:''});itemNew=false;render();say('「未着手」で作成しました。');save();return;}if(e.target.id!=='wp-doc-form')return;e.preventDefault();const f=new FormData(e.target),path=String(f.get('path')||'').trim();if(!path)return;if(docs.length>=20&&docEditor==='new'){say('試作で登録できる件数に達しました。',true);return;}const duplicate=docs.find(d=>d.id!==docEditor&&d.path.toLowerCase()===path.toLowerCase());if(duplicate){say('同じ参照先が「'+duplicate.title+'」として登録されています。既存の資料を編集してください。',true);return;}const selectedIds=f.getAll('related'),links=selectedIds.filter(id=>items.some(x=>x.id===id)).map(id=>({itemId:id,memo:String(f.get('memo-'+id)||'').trim()}));const d={id:docEditor==='new'?'doc-'+Date.now():docEditor,title:String(f.get('title')||'').trim()||path.split(/[\\/]/).filter(Boolean).pop()||path,path,description:String(f.get('description')||'').trim(),theme:String(f.get('theme')||''),links};if(docEditor==='new')docs.push(d);else docs=docs.map(old=>old.id===docEditor?d:old);docEditor=null;render();say('資料目録を更新しました。関連ページの資料名・参照先・用途メモにも反映しました。');save();});
render();
if(globalThis.Tweak){const design={compact:false};const tweak=new Tweak({container:root,onChange:()=>{root.style.setProperty('--wp-density',design.compact?'compact':'comfortable');root.querySelector('#wp-content').style.padding=design.compact?'22px 20px 10px':'';}});tweak.addToggle(design,'compact',{label:'ページの余白をコンパクトに'});}
})();
</script>
